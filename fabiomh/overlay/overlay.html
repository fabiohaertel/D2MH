<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    #stage {
      position: relative;
      transform-origin: center center;
    }

    #map {
      display: block;
    }

    #units {
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Banners dos drops: fora do #stage, que é escalado */
    #alerts {
      position: fixed;
      top: 8%;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .alert {
      padding: 12px;
      background: rgba(0, 0, 0, 0.82);
      color: #ffd700;
      font: bold 28px sans-serif;
      border: 3px solid #ffb000;
      animation: alert-blink 1s infinite;
    }

    @keyframes alert-blink {
      50% { border-color: transparent; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="map"></canvas>
    <canvas id="units"></canvas>
  </div>
  <div id="alerts"></div>
</body>

<script>
  // Chamado pelo Python (overlay/browser.py): updateMap({width, height, scale, bbox, edges}) e
  // updateUnits([{x, y, kind, label?}], [[x, y], ...] do caminho tracejado até a próxima área).
  // - updateMap desenha a borda do mapa uma vez; updateUnits só guarda a lista, e drawFrame (requestAnimationFrame)
  //   redesenha as units a cada frame para animar as runas.
  // - Os dois canvas têm a resolução já ampliada (nítidos), o tamanho CSS do bbox, e desenham em x * zoom.
  // - Runa: losango claro com brilho violeta. Não usar magenta: as saídas são losangos magenta.
  let zoom = 1;

  const UNIT_STYLES = {
    player:   { color: "#00ff00", radius: 5 },
    otherplayer: { color: "#00ff00", radius: 6, shape: "cross" },  // outros players: cruz, o local é círculo
    unique:   { color: "#ffd700", radius: 5 },
    champion: { color: "#3399ff", radius: 4 },
    minion:   { color: "#ff9900", radius: 3 },
    normal:   { color: "#ff3333", radius: 3 },
    summon:   { color: "#ffffff", radius: 3 },  // summons do necromancer e do druid (monsters.py)
    superchest: { color: "#00ffff", radius: 5, shape: "square" },
    // Marcadores fixos, com as cores que o PNG do d2-mapgenerator usava
    exit:     { color: "#ff00ff", radius: 6, shape: "diamond" },
    goodexit: { color: "#00ff00", radius: 8, shape: "diamond" },  // a tumba certa do Canyon of the Magi
    waypoint: { color: "#ffff00", radius: 6, shape: "diamond" },
    quest:    { color: "#00ff00", radius: 5, shape: "diamond" },
    boss:     { color: "#ff0000", radius: 7 },
  };

  const MAP_EDGE_COLOR = [170, 170, 170];
  const COS45 = Math.SQRT1_2;

  // m.edges: bits (np.packbits, linha a linha, bit mais alto primeiro) em base64, 1 = célula de borda
  function updateMap(m) {
    // Borda sem rotação, 1 pixel por célula, num canvas fora da tela
    const bits = Uint8Array.from(atob(m.edges), (c) => c.charCodeAt(0));
    const source = document.createElement("canvas");
    source.width = m.width;
    source.height = m.height;
    const sourceCtx = source.getContext("2d");
    const image = sourceCtx.createImageData(m.width, m.height);
    const cells = m.width * m.height;

    for (let i = 0; i < cells; i++) {
      if (bits[i >> 3] & (0x80 >> (i & 7))) {
        image.data[i * 4] = MAP_EDGE_COLOR[0];
        image.data[i * 4 + 1] = MAP_EDGE_COLOR[1];
        image.data[i * 4 + 2] = MAP_EDGE_COLOR[2];
        image.data[i * 4 + 3] = 255;
      }
    }
    sourceCtx.putImageData(image, 0, 0);

    const [left, top, right, bottom] = m.bbox;
    const mapWidth = right - left;
    const mapHeight = bottom - top;

    zoom = Math.min(window.innerWidth / mapWidth, window.innerHeight / mapHeight) * 0.95;
    document.getElementById("stage").style.transform = `scale(${zoom})`;

    // Canvas com resolução já ampliada (nítido), mas tamanho CSS do mapa: o stage escala por zoom
    for (const id of ["map", "units"]) {
      const canvas = document.getElementById(id);
      canvas.width = Math.round(mapWidth * zoom);
      canvas.height = Math.round(mapHeight * zoom);
      canvas.style.width = mapWidth + "px";
      canvas.style.height = mapHeight + "px";
    }

    // coords.world_to_map como matriz: px = k·(u − v) + cos45·H,  py = k·(u + v),  k = cos45·scale,
    // H = altura·scale; depois subtrai o bbox e amplia por zoom
    const ctx = document.getElementById("map").getContext("2d");
    const k = COS45 * m.scale;
    ctx.setTransform(zoom * k, zoom * k, -zoom * k, zoom * k,
                     zoom * (COS45 * m.height * m.scale - left), -zoom * top);
    ctx.drawImage(source, 0, 0);

    console.log("Zoom:", zoom);
  }

  // Núcleo claro com brilho violeta: as saídas já são losangos magenta sólidos
  const RUNE_FILL = "#f2e6ff";
  const RUNE_GLOW = "#b266ff";
  const RUNE_SIZE = 7;
  const PULSE_MS = 1000;

  // Drop monitorado (game/drops.py): mesmo desenho da runa, em dourado
  const DROP_FILL = "#fff2b3";
  const DROP_GLOW = "#ffb000";

  // Textos dos banners dos drops (DropTracker.active_alerts)
  function updateAlerts(alerts) {
    document.getElementById("alerts").replaceChildren(...alerts.map((text) => {
      const banner = document.createElement("div");
      banner.className = "alert";
      banner.textContent = text;
      return banner;
    }));
  }

  // Caminho até a próxima área (mapgen/route.py): tracejado branco com contorno preto
  const PATH_COLOR = "#ffffff";
  const PATH_WIDTH = 2;
  const PATH_DASH = [6, 4];

  let currentUnits = [];
  let currentPath = [];

  // units: [{x, y, kind, label?}] e path: [[x, y], ...], em pixels da imagem cropada.
  // Só guarda as listas; o desenho acontece no loop de animação (drawFrame).
  function updateUnits(units, path) {
    currentUnits = units;
    currentPath = path || [];
  }

  function drawPath(ctx, path) {
    if (path.length < 2) return;
    ctx.beginPath();
    path.forEach(([x, y], i) => i ? ctx.lineTo(x * zoom, y * zoom) : ctx.moveTo(x * zoom, y * zoom));
    ctx.lineJoin = "round";
    ctx.setLineDash(PATH_DASH);
    ctx.lineWidth = PATH_WIDTH + 2;
    ctx.strokeStyle = "#000";
    ctx.stroke();
    ctx.lineWidth = PATH_WIDTH;
    ctx.strokeStyle = PATH_COLOR;
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawUnit(ctx, unit) {
    const style = UNIT_STYLES[unit.kind] || UNIT_STYLES.normal;

    ctx.beginPath();
    if (style.shape === "square") {
      ctx.rect(unit.x * zoom - style.radius, unit.y * zoom - style.radius, style.radius * 2, style.radius * 2);
    } else if (style.shape === "cross") {
      // "+" com braços de espessura 2·t, contornado como polígono de 12 pontos
      const cx = unit.x * zoom, cy = unit.y * zoom, r = style.radius, t = r * 0.3;
      const outline = [[-t, -r], [t, -r], [t, -t], [r, -t], [r, t], [t, t],
                       [t, r], [-t, r], [-t, t], [-r, t], [-r, -t], [-t, -t]];
      outline.forEach(([dx, dy], i) => i ? ctx.lineTo(cx + dx, cy + dy) : ctx.moveTo(cx + dx, cy + dy));
      ctx.closePath();
    } else if (style.shape === "diamond") {
      ctx.moveTo(unit.x * zoom, unit.y * zoom - style.radius);
      ctx.lineTo(unit.x * zoom + style.radius, unit.y * zoom);
      ctx.lineTo(unit.x * zoom, unit.y * zoom + style.radius);
      ctx.lineTo(unit.x * zoom - style.radius, unit.y * zoom);
      ctx.closePath();
    } else {
      ctx.arc(unit.x * zoom, unit.y * zoom, style.radius, 0, 2 * Math.PI);
    }
    ctx.fillStyle = style.color;
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = "#000";
    ctx.stroke();
  }

  // Runa (e drop, com outras cores): losango com halo pulsante, um anel de "ping" que expande e some, e o nome em cima
  function drawRune(ctx, unit, phase, fill = RUNE_FILL, glow = RUNE_GLOW) {
    const x = unit.x * zoom;
    const y = unit.y * zoom;
    const pulse = (Math.sin(phase * 2 * Math.PI) + 1) / 2;  // 0..1

    // Ping: anel que cresce e desaparece a cada ciclo
    ctx.beginPath();
    ctx.arc(x, y, RUNE_SIZE + phase * 18, 0, 2 * Math.PI);
    ctx.strokeStyle = glow;
    ctx.globalAlpha = 1 - phase;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Losango com brilho
    ctx.save();
    ctx.shadowColor = glow;
    ctx.shadowBlur = 6 + pulse * 14;
    ctx.beginPath();
    ctx.moveTo(x, y - RUNE_SIZE);
    ctx.lineTo(x + RUNE_SIZE, y);
    ctx.lineTo(x, y + RUNE_SIZE);
    ctx.lineTo(x - RUNE_SIZE, y);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.restore();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = glow;
    ctx.stroke();

    if (unit.label) {
      ctx.font = "bold 12px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "bottom";
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#000";
      ctx.strokeText(unit.label, x, y - RUNE_SIZE - 3);
      ctx.fillStyle = "#fff";
      ctx.fillText(unit.label, x, y - RUNE_SIZE - 3);
    }
  }

  function drawFrame(now) {
    const canvas = document.getElementById("units");
    const ctx = canvas.getContext("2d");
    const phase = (now % PULSE_MS) / PULSE_MS;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawPath(ctx, currentPath);
    for (const unit of currentUnits) {
      if (unit.kind === "rune") {
        drawRune(ctx, unit, phase);
      } else if (unit.kind === "drop") {
        drawRune(ctx, unit, phase, DROP_FILL, DROP_GLOW);
      } else {
        drawUnit(ctx, unit);
      }
    }

    requestAnimationFrame(drawFrame);
  }

  requestAnimationFrame(drawFrame);
</script>
</html>
